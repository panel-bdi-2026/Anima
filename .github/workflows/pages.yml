# Publica el juego en GitHub Pages:
#   https://panel-bdi-2026.github.io/Anima/              -> versión publicada (rama main)
#   https://panel-bdi-2026.github.io/Anima/prueba/pr-N/  -> versión de prueba de cada Pull Request abierto
#   https://panel-bdi-2026.github.io/Anima/prueba/cambios.json -> lista de pruebas (la más reciente primero)
# Se ejecuta al cambiar main y al abrir, actualizar, editar, reabrir o cerrar un Pull Request.
# Requisito (una sola vez): Settings -> Pages -> Source = "GitHub Actions".
#
# Escenario de prueba: si la descripción del Pull Request tiene un bloque
#   <!-- escenario {"tipo": "combate", ...} -->
# se guarda en canal.json y la app abre la prueba directo ahí (ver js/channel.js y CLAUDE.md).
#
# Seguridad: pull_request_target usa siempre este archivo tal como está en main
# (un Pull Request no puede cambiar cómo se publica) y el código de los Pull Requests
# solo se copia, nunca se ejecuta. Solo se publican ramas de este mismo repositorio.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# una publicación a la vez; cada una calcula el estado actual, así que la última siempre queda bien
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
          fetch-depth: 0 # para contar los cambios unidos (número de versión)

      - name: Armar el sitio
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git -C main rev-parse --short HEAD)
          mkdir -p _site
          cp -a main/. _site/
          rm -rf _site/.git _site/.github _site/prueba
          sed -i "s/build: 'dev'/build: '$MAIN_SHA'/" _site/js/version.js
          # versión: cada cambio unido a main suma 0,01 (con 11 cambios en main era la v0.05)
          N=$(( $(git -C main rev-list --count --first-parent HEAD) - 6 ))
          V=$(awk -v n="$N" 'BEGIN { printf "%.2f", n / 100 }')
          sed -i "s/^const ANIMA_VERSION = { v: '[^']*'/const ANIMA_VERSION = { v: '$V'/" _site/js/version.js
          echo "Versión publicada: v$V"; grep -m1 'ANIMA_VERSION = ' _site/js/version.js
          # cada publicación pide sus archivos con su propio código (js/x.js?v=abc1234): así el celular
          # nunca mezcla archivos nuevos con otros viejos guardados (eso dejaba la pantalla negra)
          sed -i -E "s#(<script src=\"(js/[^\"?]+\.js))\"#\1?v=$MAIN_SHA\"#g" _site/index.html
          grep -c "?v=$MAIN_SHA" _site/index.html
          mkdir -p _site/prueba

          # Pull Requests abiertos desde ramas de este mismo repositorio
          gh api "repos/$REPO/pulls?state=open&per_page=100" \
            | jq --arg repo "$REPO" '[.[] | select(.head.repo != null and .head.repo.full_name == $repo)]' > prs.json
          # "cambio más reciente" = el último commit o la apertura del Pull Request (los comentarios no cuentan)
          echo '[]' > cambios.json
          for row in $(jq -r '.[] | "\(.number)|\(.head.sha)|\(.created_at)"' prs.json); do
            IFS='|' read -r num sha created <<< "$row"
            cdate=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.committer.date')
            d=$(printf '%s\n%s\n' "$created" "$cdate" | sort | tail -n 1)
            jq --argjson n "$num" --arg d "$d" '. + [{pr: $n, updated: $d}]' cambios.json > t.json && mv t.json cambios.json
          done
          jq 'sort_by(.updated) | reverse | .[:8]' cambios.json > t.json && mv t.json cambios.json
          echo "Pruebas a publicar:"; cat cambios.json

          for num in $(jq -r '.[].pr' cambios.json); do
            dest="_site/prueba/pr-$num"
            sha=$(jq -r --argjson n "$num" '.[] | select(.number == $n) | .head.sha' prs.json)
            git -C main fetch --quiet --no-tags --depth=1 origin "pull/$num/head"
            mkdir -p "$dest"
            git -C main archive "$sha" | tar -x -C "$dest"
            rm -rf "$dest/.github"
            # datos de la prueba (título, rama, escenario sacado de la descripción)
            jq --argjson n "$num" '.[] | select(.number == $n)' prs.json > pr.json
            python3 - "$dest/canal.json" "$REPO" "$(jq -r --argjson n "$num" '.[] | select(.pr == $n) | .updated' cambios.json)" <<'EOF'
          import json, re, sys
          out, repo, updated = sys.argv[1], sys.argv[2], sys.argv[3]
          p = json.load(open('pr.json', encoding='utf-8'))
          body = p.get('body') or ''
          esc = None
          m = re.search(r'<!--\s*escenario\s*(\{.*?\})\s*-->', body, re.S)
          if m:
              try:
                  esc = json.loads(m.group(1))
              except Exception as e:
                  print('Escenario no válido en #%s: %s' % (p['number'], e))
          data = {'pr': p['number'], 'title': p['title'], 'branch': p['head']['ref'], 'sha': p['head']['sha'],
                  'url': p['html_url'], 'updated': updated, 'repo': repo, 'escenario': esc}
          json.dump(data, open(out, 'w', encoding='utf-8'), ensure_ascii=False)
          print('#%s: %s | escenario: %s' % (p['number'], p['title'], json.dumps(esc, ensure_ascii=False)))
          EOF
            # Si la prueba es anterior a js/channel.js, se le añade el de main: así siempre tiene
            # partidas separadas, el aviso y la revisión. Se quita el manifiesto (no se instala aparte).
            cp main/js/channel.js "$dest/canal_inyectado.js"
            python3 - "$dest/index.html" <<'EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'<link[^>]*rel="manifest"[^>]*>\s*', '', s)
          if 'js/channel.js' not in s:
              s = re.sub(r'(<head[^>]*>)', r'\1\n<script src="canal_inyectado.js"></script>', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
            if [[ -f "$dest/js/version.js" ]]; then sed -i "s/build: 'dev'/build: '${sha:0:7}'/" "$dest/js/version.js"; fi
            sed -i -E "s#(<script src=\"(js/[^\"?]+\.js))\"#\1?v=${sha:0:7}\"#g" "$dest/index.html"
          done

          # lista para el menú VERSIÓN de la versión publicada
          if ls _site/prueba/pr-*/canal.json > /dev/null 2>&1; then
            jq -s '{cambios: (sort_by(.updated) | reverse | map(del(.escenario)))}' _site/prueba/pr-*/canal.json > _site/prueba/cambios.json
          else
            echo '{"cambios":[]}' > _site/prueba/cambios.json
          fi
          cat _site/prueba/cambios.json

          # prueba/ sin número (enlaces viejos): lleva a la más reciente, o de vuelta a la publicada
          cat > _site/prueba/index.html <<'EOF'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ánima: versión de prueba</title>
          <style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0b14;color:#fff;font:16px system-ui,sans-serif;text-align:center}</style></head>
          <body><p>Buscando la versión de prueba…</p>
          <script>fetch('cambios.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
            var c = j.cambios && j.cambios[0]; location.replace(c ? 'pr-' + c.pr + '/#probar' : '../');
          }).catch(function () { location.replace('../'); });</script></body></html>
          EOF
          echo "Contenido de prueba/:"; ls _site/prueba

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
