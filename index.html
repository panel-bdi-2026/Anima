<style>
  html, body { margin: 0; height: 100%; background: #0d0b14; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; box-shadow: 0 0 40px #000; cursor: none; }
  #boot { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; background: #0d0b14; color: #ffe8d8; font: 15px/1.4 system-ui, sans-serif; text-align: center; }
  #boot.off { display: none; }
  #boot.crash { background: rgba(13, 11, 20, .88); }
  #boot b { color: #ffd048; font-size: 17px; }
  #boot .err { max-width: 520px; white-space: pre-line; font: 12px/1.4 ui-monospace, monospace; color: #c8b0e0; word-break: break-word; }
  #boot .err:empty { display: none; }
  #boot .row { display: flex; gap: 10px; }
  #boot button { font: bold 15px system-ui, sans-serif; border: 0; border-radius: 9px; padding: 11px 18px; background: #ffd048; color: #2a1638; touch-action: manipulation; }
  #boot button.alt { background: #c8b0e0; }
  #boot button[hidden], #boot .hint[hidden] { display: none; }
  #boot .hint { font-size: 13px; color: #c8b0e0; max-width: 420px; }
</style>
<script>
  // Arranque protegido: mientras carga se ve «Cargando…». Si un archivo no llega o hay un error,
  // en vez de quedar la pantalla negra se avisa qué pasó y se ofrece reintentar (sin la caché).
  // Si el juego ya andaba y falla, se ofrece recargar o seguir.
  (function () {
    var errs = [], el, msg, err, retry, cont, started = false, crashAt = -1e9;
    function ui() {
      if (el) return;
      el = document.getElementById('boot');
      msg = el.querySelector('b'); err = el.querySelector('.err'); retry = el.querySelector('.retry'); cont = el.querySelector('.alt');
      retry.onclick = Boot.retry; cont.onclick = function () { el.className = 'off'; };
    }
    window.Boot = {
      errors: errs,
      ok: function () { started = true; ui(); if (el.className !== 'crash') el.className = 'off'; },
      fail: function (why) {
        ui(); el.className = ''; msg.textContent = why || 'El juego no pudo arrancar.';
        err.textContent = errs.slice(0, 3).join('\n'); retry.hidden = false; cont.hidden = true; el.querySelector('.hint').hidden = false;
      },
      // error con el juego ya andando: se avisa una vez (y de nuevo solo pasados 20 s)
      crash: function (e) {
        var now = Date.now(); if (now - crashAt < 20000) return; crashAt = now;
        errs.push(String(e && e.message || e));
        ui(); el.className = 'crash'; msg.textContent = 'Algo falló en el juego.';
        err.textContent = errs.slice(0, 3).join('\n'); retry.hidden = false; cont.hidden = false; el.querySelector('.hint').hidden = false;
      },
      // recarga pidiendo todo de nuevo al servidor (se borra la copia guardada de los archivos)
      retry: function () {
        var go = function () { location.replace(location.pathname + '?r=' + Date.now() + location.hash); };
        try { if (window.caches) caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }).then(go, go); else go(); } catch (e) { go(); }
        setTimeout(go, 1500);
      },
    };
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && (t.src || t.href)) errs.push('No llegó el archivo ' + String(t.src || t.href).split('/').pop());
      else errs.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : ''));
    }, true);
    window.addEventListener('load', function () {
      setTimeout(function () { if (!started) Boot.fail(errs.length ? 'El juego no pudo arrancar.' : null); }, 1500);
    });
    // si tarda demasiado (conexión muy lenta), se ofrece reintentar sin dejar de esperar
    setTimeout(function () { if (!started) { ui(); retry.hidden = false; msg.textContent = 'Está tardando mucho en cargar…'; } }, 25000);
  })();
</script>
